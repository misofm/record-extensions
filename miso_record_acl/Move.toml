[package]
name = "miso_record_acl"
edition = "2024"
license = "Apache-2.0"
authors = ["Miso Labs, Inc. (build@miso.network)"]

# The policy needs the typed protocol objects it gates against — `Release` for
# the tracklist, `Recording` and `Composition` for the phantom share type that
# discharges link 4 — and the `Record` that is the credential. Nothing else:
# Seal itself is off-chain, so a Seal policy has no Seal dependency.
[dependencies]
miso = { git = "https://github.com/misonetwork/protocol.git", rev = "7bda0bb740c32a75ef76c0739cb671b3de77d338" }
miso_record = { git = "https://github.com/misofm/record.git", subdir = "move", rev = "aaf091b18cdd551677a6d604bf0902919c31f366" }
